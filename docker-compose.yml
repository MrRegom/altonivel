# Alto Nivel · Cotizaciones y facturación
#
#   cp .env.produccion.example .env.produccion   # completar valores
#   docker compose up -d --build
#   docker compose exec web python manage.py createsuperuser
#
# La base de datos (SQLite) y los PDF/XML quedan en el volumen "altonivel_data".

services:
  web:
    build: .
    image: altonivel-facturacion
    container_name: altonivel-web
    restart: unless-stopped
    env_file: .env.produccion
    ports:
      - "${APP_PORT:-8090}:8000"
    volumes:
      - altonivel_data:/app/data

  # Consulta cada 5 minutos el estado de las facturas ante el SII y envía
  # el correo al cliente cuando son aceptadas.
  estados:
    build: .
    image: altonivel-facturacion
    container_name: altonivel-estados
    restart: unless-stopped
    env_file: .env.produccion
    depends_on:
      - web
    volumes:
      - altonivel_data:/app/data
    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do python manage.py actualizar_estados_dte || true; sleep 300; done"]

volumes:
  altonivel_data:
